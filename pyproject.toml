[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smb-simulator"
version = "1.0.0"
description = "Simulated moving bed (SMB) chromatography simulator with a local web app"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "Yadong (Leo) Chiang" }
]
dependencies = [
  "numpy>=1.21"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Chemistry"
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/YC-Leo/SMB-simulator"
Repository = "https://github.com/YC-Leo/SMB-simulator"
Issues = "https://github.com/YC-Leo/SMB-simulator/issues"

[tool.setuptools]
packages = ["smbsim", "webapp"]

[tool.setuptools.package-data]
webapp = ["static/*"]
